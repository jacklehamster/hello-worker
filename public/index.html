<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Welcome Note Test</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    #log { background:#111; color:#0f0; padding:10px; height:260px; overflow:auto; white-space:pre; }
    textarea { width: 100%; height: 80px; }
    input, button, textarea { font-size: 14px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>Welcome Note Test</h1>
  <p>Status: <b id="status">connecting…</b></p>

  <h3>Welcome note (sent to newcomers)</h3>
  <input id="welcome" size="80" value="Hello 👋 welcome friend!"></input>

  <h3>Log (one line per network message)</h3>
  <div id="log" style="transition: scroll 500ms"></div>
  <div style="display: flex; flex-direction: row; gap: 10px; margin-top: 10px;">
    <button id="clear-log">Clear log</button>
    <button id="welcome-button" disabled>welcome</button>
    <button id="webrtc-button">test webRTC</button>
  </div>

  <div>
    <a id="self-link" href="" target="_blank">Open this page in a new window</a>
  </div>


  <script type="module">
    import { testWelcome, testWebRTC, clearLog } from "./sample.js";

    let onExit;
    function setupWelcome() {
      location.hash = "";
      document.getElementById("self-link").href = location.href;
      document.getElementById("welcome-button").disabled = true;
      document.getElementById("webrtc-button").disabled = false;
      onExit = testWelcome();
    }
    function setWebRTC() {
      location.hash = "webrtc";
      document.getElementById("self-link").href = location.href;
      document.getElementById("welcome-button").disabled = false;
      document.getElementById("webrtc-button").disabled = true;
      onExit = testWebRTC();   
    }

    if (location.hash === "#webrtc") {
      setWebRTC();
    } else {
      setupWelcome();
    }

    document.getElementById("clear-log").onclick = () => {
      clearLog();
    };
    document.getElementById("welcome-button").onclick = () => {
      onExit?.();
      setupWelcome();
    };
    document.getElementById("webrtc-button").onclick = () => {
      onExit?.();
      setWebRTC();
    };
  </script>
</body>
</html>
